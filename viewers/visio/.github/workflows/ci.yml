name: Verify viewer packages
on:
  push:
    branches: [main]
    # Community health files change nothing CI checks. Pull requests are never filtered because
    # `ci-success` is a required check.
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.number || github.ref) || github.run_id }}
  # A newer push or PR update supersedes the run in flight; scheduled and manual runs always finish.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/bindings/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix packages/bindings --ignore-scripts
      - run: npm ci --prefix docs --ignore-scripts
      - run: npm run check
      - name: Verify standalone MCP
        working-directory: mcp
        run: |
          npm install --ignore-scripts --no-package-lock
          npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
# Verification artifacts contain only synthetic demo drawings and documentation screenshots.
