name: CI

# Ported from ChristopherVR/docx-viewer .github/workflows/ci.yml. Tests and demos fall back to the
# published ooxml-core and ooxml-ui when the sibling ooxml checkout is absent, as it is here.

on:
  push:
    branches: [main]
    # Community health files change nothing CI checks. Pull requests are never filtered because
    # `ci-success` is a required check.
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
  # No paths-ignore on pull requests: `ci-success` is a required check, and a required check that
  # never reports (because every path was ignored) blocks the merge.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.number || github.ref) || github.run_id }}
  # A newer push or PR update supersedes the run in flight; scheduled and manual runs always finish.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The Svelte demo resolves its package through dist, so build before type-checking.
      - run: bun run build:packages
      - run: bun run typecheck
      - run: bun run test
      # Release machinery: planner, publish guards, local publish helper, commit and changelog checks.
      - run: bun run test:scripts
      - run: bun run check:changelog
      # No published tarball may import the private web component or anything undeclared.
      - run: bun run check:published
      - run: bun run pack:smoke

  # The single check the `main` ruleset requires. Funnelling through one job keeps branch
  # protection stable when jobs are added or renamed (a required check that no longer exists blocks
  # every PR silently). `always()` plus the explicit result test is deliberate: without it a
  # cancelled or skipped dependency would let this pass.
  ci-success:
    name: ci-success
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success) ;;
              *)
                echo "::error::A required CI job did not succeed (got: $results)."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs succeeded."
