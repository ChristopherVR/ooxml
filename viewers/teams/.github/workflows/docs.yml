name: Deploy Docs and Demos to GitHub Pages

# Adapted from ChristopherVR/docx-viewer .github/workflows/docs.yml. Builds the VitePress site in
# docs/ (its own install) and the vanilla and React demos into /demo/ and /demo-react/. Pages is
# static: the demos run in the core's local mode (BroadcastChannel between tabs of one browser) and
# say so on the page. The demos alias the bindings to their source, so no package build is needed;
# without the sibling ooxml checkout they use the published ooxml-core and ooxml-ui.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'demos/**'
      - 'packages/**'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install documentation dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build Pages site and demos
        run: bun run build:pages
      - name: Configure Pages
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_PAGES == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event.repository.private == false || vars.ENABLE_PRIVATE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
