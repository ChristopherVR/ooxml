name: Bug report
description: Something syncs, displays, or behaves incorrectly
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing you can give us is
        **the steps that reproduce it** plus **which bindings you checked**.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the attached file
        2. ...
    validations:
      required: true

  - type: checkboxes
    id: bindings-affected
    attributes:
      label: Which bindings did you see this in?
      description: >-
        Tick only what you actually tried. This project ships the same
        `<teams-app>` element through six bindings, and a bug present in more
        than one usually comes from shared code (`ooxml-ui/teams` or `ooxml-core/teams`),
        which changes where we fix it. "I only tried one" is a perfectly fine answer.
      options:
        - label: React (`openteams-react-viewer`)
        - label: Vue (`openteams-vue-viewer`)
        - label: Angular (`openteams-angular-viewer`)
        - label: Svelte (`openteams-svelte-viewer`)
        - label: Solid (`openteams-solid-viewer`)
        - label: Vanilla (`openteams-vanilla-viewer`)
        - label: The `<teams-app>` element on its own (no framework)
        - label: I did not check the others

  - type: input
    id: version
    attributes:
      label: Package version(s)
      placeholder: 'openteams-react-viewer@1.0.0'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Browser: Chrome 141
        OS: Windows 11
        Framework version: React 19.2

  - type: textarea
    id: console
    attributes:
      label: Console errors
      render: text
