name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev) rates the repository's supply-chain practices: branch
# protection, pinned dependencies, token permissions, signed releases, CI tests and so on. Findings
# land in the Security tab; the published score feeds the badge in .github/README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 2' # weekly
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# publish_results only accepts a minimal workflow: no top-level env or defaults, no `run` steps,
# and only checkout, upload-artifact and upload-sarif besides the scorecard action itself.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results to the public Scorecard API (needed for the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
