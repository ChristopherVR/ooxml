name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev) rates the repository's supply-chain practices: branch
# protection, pinned dependencies, token permissions, signed releases, CI tests and so on. Findings
# land in the Security tab; the published score feeds the badge in .github/README.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 2' # weekly
  # Re-score when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# publish_results only accepts a minimal workflow: no top-level env or defaults, no `run` steps,
# and only checkout, upload-artifact and upload-sarif besides the scorecard action itself.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # The scorecard action is third-party code, so this job's token writes nothing; `upload`
    # puts the results in code scanning.
    permissions:
      # Publish the results to the public Scorecard API (needed for the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 1

  upload:
    name: Upload to code scanning
    needs: [analysis]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scorecard-sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
