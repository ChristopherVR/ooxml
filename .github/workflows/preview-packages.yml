name: Preview packages

# Publishes every pull request's ooxml-core and ooxml-ui to pkg.pr.new (https://pkg.pr.new), a free
# preview registry for open source, and comments the install commands on the PR. A viewer, the
# suite or an outside consumer can then try an unreleased change with `npm i <url>` instead of
# waiting for a release.
#
# Needs the pkg.pr.new GitHub App installed on the repository (https://github.com/apps/pkg-pr-new);
# it authenticates the upload from this workflow run, so no token or secret is involved. Previews
# are not npm releases: nothing here touches npm, tags or the release flow.
#
# A preview carries this repository's name, so only reviewed code gets one. Pull requests from
# branches of this repository publish on every push. A fork's pull request publishes only when a
# maintainer adds the `preview-packages` label, and then only the head it has at that moment: a
# later push does not publish, so remove and re-add the label after reviewing the new head.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/core/**'
      - 'src/ui/**'
      - 'apps/office-suite/**'
      - 'site/**'
      - 'viewers/pptx/packages/vanilla/**'
      - 'scripts/build-suite.mjs'
      - 'scripts/bundle-suite.mjs'
      - 'scripts/build-pwa.mjs'
      - 'scripts/pwa/**'
      - 'scripts/prepare-preview-template.mjs'
      - 'scripts/preview-site.mjs'
      - 'scripts/esm-declarations.mjs'
      - 'bun.lock'
      - '.github/workflows/preview-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish previews
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled') ||
      (github.event.action == 'labeled' && github.event.label.name == 'preview-packages')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Build the fork's actual commit, rather than GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Keep preview infrastructure available even when an older fork lacks the new scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .preview-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup/
            /scripts/prepare-preview-template.mjs
            /scripts/preview-site.mjs
      - uses: ./.preview-tools/.github/actions/setup
      - run: bun run build
      - run: bun run --cwd src/ui build
      - name: Build the Office suite template
        run: node scripts/build-suite.mjs
      - name: Record the preview source and configure StackBlitz
        env:
          PREVIEW_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
        run: node .preview-tools/scripts/prepare-preview-template.mjs
      # Full URLs also support the built suite package, which is only published to this
      # preview registry. The small playground installs it instead of POSTing its assets.
      # Until the app is installed the upload is refused with "is not installed on or does not have
      # access to"; that is a missing setup step, not a broken change, so it warns instead of failing
      # the pull request. Any other error still fails.
      # pkg-pr-new is the root devDependency bun.lock pins, run from node_modules.
      - name: Publish to pkg.pr.new
        run: |
          set +e
          node_modules/.bin/pkg-pr-new publish --no-compact --comment=update --commentWithSha --template ./preview-template ./suite-dist ./src/core ./src/ui 2>&1 | tee "$RUNNER_TEMP/pkg-pr-new.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q 'is not installed on or does not have access to' "$RUNNER_TEMP/pkg-pr-new.log"; then
            echo "::warning title=Preview packages skipped::Install the pkg.pr.new GitHub App (https://github.com/apps/pkg-pr-new) on this repository to publish previews."
            exit 0
          fi
          exit "$status"
