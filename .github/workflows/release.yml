name: Release

# Adapted from ChristopherVR/pptx-viewer .github/workflows/release.yml (Apache-2.0). See
# docs/releasing.md for the whole flow. Two packages (core at the root, ooxml-ui at packages/ui),
# each with its own tag, changelog and npm publish.

on:
  # Hourly. The planner is cumulative (the package is diffed from its own last tag), so everything
  # merged since the previous run lands in one release, and a run with no changes exits at the
  # planning step, so quiet hours are cheap no-ops. The baseline tag
  # `ooxml-core@0.1.0` marks the version already published, so the first run is a
  # no-op until a commit touches published files (see docs/releasing.md). A package that is
  # neither tagged nor on npm (ooxml-ui before its first publish) is released as `initial`.
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  # Manual runs, two modes:
  #   - no input: cut a release now (same as the schedule would).
  #   - tag=<npm-name>@<version>: re-publish ONLY that existing tag (either package) to npm,
  #     skipping the release job. Useful when a publish was skipped or failed:
  #       gh workflow run release.yml -f tag=ooxml-core@0.1.0
  #       gh workflow run release.yml -f tag=ooxml-ui@0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-publish (leave empty to cut a full release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# One release at a time: two overlapping runs would race on the version-bump commit and the tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Full release on schedule, or on manual dispatch without a tag input. Dispatch WITH a tag
    # skips straight to the publish job (re-publish mode).
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      any_released: ${{ steps.tagged.outputs.any_released || 'false' }}
      release_sha: ${{ steps.tagged.outputs.release_sha || '' }}
    steps:
      # This job pushes a version-bump commit straight to `main`, so it needs credentials that can
      # get past the branch ruleset (which requires `ci-success`, and applies to direct pushes
      # too). The default GITHUB_TOKEN cannot: GitHub refuses to let `github-actions[bot]` be
      # granted ruleset bypass. RELEASE_TOKEN must be a fine-grained PAT with `Contents: Read and
      # write` on this repo, owned by a repository admin (the Admin role is on the ruleset's bypass
      # list). Without it everything up to the push still works and the push fails with an explicit
      # diagnostic.
      #
      # Unlike GITHUB_TOKEN, a PAT push DOES trigger workflows; the release commit carries
      # `[skip ci]`, which GitHub honours natively, so it does not start a CI run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Plan FIRST (before installing or building): it only reads git history and the npm registry.
      # It is the first of two early-exit gates, so a quiet hour is a cheap no-op.
      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs --write

      # A package published by hand (the manual first publish of ooxml-ui) has no tag yet. The
      # planner baselines it at the commit npm recorded (or HEAD); record that as the tag so the
      # next run finds it. No-op once the tags exist.
      - name: Adopt baseline tags for packages published by hand
        run: |
          node -e "for (const p of Object.values(require('./release-plan.json').packages)) if (p.adopt) console.log(p.adopt.tag + ' ' + p.adopt.sha)" |
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            echo "Adopting $tag at $sha"
            git tag "$tag" "$sha"
            git push origin "refs/tags/$tag"
          done

      # Publishing is switched on per repository, so a release is never tagged that cannot be
      # published afterwards. Set the NPM_PUBLISH repository variable to 'true' to enable.
      - name: Verify publishing is enabled
        if: steps.plan.outputs.any_changed == 'true' && vars.NPM_PUBLISH != 'true'
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true': a release was planned but npm publishing is disabled."
          echo "Set the NPM_PUBLISH repository variable to 'true' (Settings > Secrets and variables > Actions > Variables)."
          exit 1

      # `release-plan.mjs --write` bumped the package.json version; install without --frozen-lockfile
      # so the lockfile is regenerated if bun records it anywhere.
      - name: Install dependencies
        if: steps.plan.outputs.any_changed == 'true'
        run: bun install

      # All-or-nothing: a build or smoke-test failure fails the run before anything is committed,
      # tagged or published, and the next run retries from the same baseline. Typecheck and the
      # unit tests are not repeated here: `main` is protected by the `ci-success` check.
      - name: Build and smoke-test the package
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          bun run build
          bun run test:package
          node scripts/build-released.mjs --smoke

      # Prepend the new release section to CHANGELOG.md. Prepend (rather than regeneration) means
      # shipped sections are never rewritten, so old tags can be culled by prune-releases without
      # corrupting changelog history.
      - name: Generate the changelog
        if: steps.plan.outputs.any_changed == 'true'
        # `[remote.github]` in cliff.toml makes git-cliff call the GitHub API; authenticate it
        # (5000/hour) or it panics on the unauthenticated 60/hour limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `$inc` holds git-cliff glob PATTERNS ("src/**") and must stay unquoted so its words
          # split into separate arguments; disable filename expansion so the shell does not expand
          # the globs first (that silently produced heading-only changelog sections).
          set -f
          field() { node -p "require('./release-plan.json').packages['$1']$2"; }
          for key in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).join(' ')"); do
            npm=$(field "$key" .npm)
            tag=$(field "$key" .tag)
            changelog=$(field "$key" .changelog)
            inc=$(node -e "console.log(require('./release-plan.json').packages['$key'].includePaths.map(p => '--include-path ' + p).join(' '))")
            echo "Changelog for $npm -> $tag ($changelog)"
            if [ -f "$changelog" ]; then
              bunx git-cliff --config cliff.toml --tag-pattern "^${npm}@" $inc --unreleased --tag "$tag" --prepend "$changelog"
            else
              bunx git-cliff --config cliff.toml --tag-pattern "^${npm}@" $inc --tag "$tag" --output "$changelog"
            fi
          done

      - name: Commit version bumps and changelogs
        if: steps.plan.outputs.any_changed == 'true'
        env:
          # Presence check only, never the value; tells "no token configured" apart from "token
          # configured but still rejected" in the failure branch below.
          HAVE_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage each released package's changelog and manifest (version bump) AND the lockfile,
          # so package.json + bun.lock in the repo always match what is published and the tag
          # points at a commit whose manifests are truthful.
          git add $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).flatMap(k=>[p.packages[k].manifest,p.packages[k].changelog]).join(' ')") bun.lock
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): bump versions and update changelogs [skip ci]"
            # `main` can move between checkout and here; rebase onto the new tip and retry.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt was rejected; rebasing onto origin/main"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Release commit conflicts with origin/main; resolve by hand and re-run."
                exit 1
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push the release commit to main after 3 attempts."
              if [ -z "$HAVE_RELEASE_TOKEN" ]; then
                echo "The RELEASE_TOKEN secret is not set, so this pushed as github-actions[bot],"
                echo "which can never be granted ruleset bypass. Create a fine-grained PAT with"
                echo "'Contents: Read and write' on this repo, owned by a repository admin, and"
                echo "save it as the RELEASE_TOKEN secret. Rules: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/rules"
              else
                echo "RELEASE_TOKEN is set but the push was still rejected. Check that its owner is"
                echo "a bypass actor on the ruleset covering main, that the token grants"
                echo "'Contents: Read and write' on this repo, and that it has not expired."
                echo "Rules: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/rules"
              fi
              exit 1
            fi
          fi

      # Cut the tag + GitHub release. The tag points at the (pushed) release commit; the
      # release body is that package's newest changelog section. No tarball assets: npm (with
      # provenance) is the artifact registry. GITHUB_TOKEN-created tags do not trigger workflows.
      - name: Tag and release changed packages
        id: tagged
        if: steps.plan.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release-notes.mjs shells out to git-cliff, which reads GITHUB_TOKEN for [remote.github].
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          field() { node -p "require('./release-plan.json').packages['$1']$2"; }
          RELEASED=""
          for key in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).join(' ')"); do
            tag=$(field "$key" .tag)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping"
              continue
            fi
            node scripts/release-notes.mjs "$key" > "${RUNNER_TEMP}/notes.md"
            changelog=$(field "$key" .changelog)
            {
              echo ""
              echo "---"
              echo "Superseded releases are pruned from this page; the full version history lives in [\`${changelog}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/${changelog})."
            } >> "${RUNNER_TEMP}/notes.md"
            gh release create "$tag" --target "$COMMIT" --title "$tag" --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Released $tag"
            RELEASED="${RELEASED}${key} "
          done
          if [ -n "$RELEASED" ]; then
            echo "any_released=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "any_released=false" >> "$GITHUB_OUTPUT"
          fi

      # Stash the release plan so the publish job can resolve package versions without
      # re-running the planner. Artifact names are unique per run.
      - name: Upload release plan for publish job
        if: steps.tagged.outputs.any_released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          retention-days: 1

      # Retire the releases each new tag supersedes (tags are kept), so the Releases page lists
      # one release per package: the current version. The scheduled prune-releases workflow is the
      # backstop.
      - name: Prune superseded releases
        if: steps.tagged.outputs.any_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-releases.mjs --keep 1

  # Publish to npm, in two modes:
  #
  # AUTO (schedule, or dispatch without a tag): runs after the `release` job, checks out the
  #   release commit it pushed and publishes the packages listed in the release-plan.json artifact.
  #
  # RE-PUBLISH (dispatch with a tag): skips the `release` job and publishes exactly the tag
  #   supplied via the `tag` input, checked out at that tag so the build matches the release.
  #
  # Auth: npm trusted publishing (OIDC), no token. The package needs a trusted publisher on
  # npmjs.com pointing at this repository, the workflow file `release.yml` and the environment `npm`.
  publish:
    needs: [release]
    # `always()` lets this job run even when `release` was skipped (re-publish dispatch).
    if: |
      always() &&
      needs.release.result != 'failure' && (
        needs.release.outputs.any_released == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - name: Verify publishing is enabled
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true' - npm publishing is disabled."
          exit 1

      # Auto mode: the release commit the release job pushed (so manifests carry the new versions).
      - name: Checkout the release commit
        if: inputs.tag == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}

      # Re-publish mode: the exact tag, so the build matches what was released.
      - name: Checkout at tag (re-publish)
        if: inputs.tag != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_id }}

      # Node 24 plus npm >= 11.5.1 is required for trusted publishing and --provenance.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@^11.5.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile

      - run: bun run build

      # Workspace packages (ooxml-ui) build after core, which they resolve through its dist.
      # In re-publish mode there is no plan artifact, so build every workspace package present.
      - name: Build workspace packages
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/release-plan.mjs --no-npm >/dev/null
            node scripts/build-released.mjs --all
          else
            node scripts/build-released.mjs
          fi

      # Publishes each released package from its own directory (core first, then ooxml-ui), with
      # OIDC provenance. A `workspace:` range on core is rewritten to a caret range for the upload.
      - name: Publish to npm
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/publish-released.mjs --tag "$INPUT_TAG"
          else
            node scripts/publish-released.mjs --plan release-plan.json
          fi
