name: Release

# Adapted from ChristopherVR/pptx-viewer .github/workflows/release.yml (Apache-2.0). See
# docs/releasing.md for the whole flow. Every published package of this repository (core at the
# root, ooxml-ui at src/ui, the MCP server, and the packages of the viewers under viewers/,
# listed in scripts/viewer-packages.mjs) has its own tag, changelog and npm publish, planned by
# scripts/release-plan.mjs.

on:
  # Hourly. The planner is cumulative (the package is diffed from its own last tag), so everything
  # merged since the previous run lands in one release, and a run with no changes exits at the
  # planning step, so quiet hours are cheap no-ops. The baseline tag
  # `ooxml-core@0.1.0` marks the version already published, so the first run is a
  # no-op until a commit touches published files (see docs/releasing.md). A package that is
  # neither tagged nor on npm (ooxml-ui before its first publish) is released as `initial`.
  schedule:
    - cron: '0 * * * *' # hourly, on the hour
  # Manual runs, two modes:
  #   - no input: cut a release now (same as the schedule would).
  #   - tag=<npm-name>@<version>: re-publish ONLY that existing tag (either package) to npm,
  #     skipping the release job. Useful when a publish was skipped or failed:
  #       gh workflow run release.yml -f tag=ooxml-core@0.1.0
  #       gh workflow run release.yml -f tag=ooxml-ui@0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-publish (leave empty to cut a full release)'
        required: false
        default: ''
        type: string
      skip_ci_check:
        description: 'Bypass the CI gate: release even when the latest CI run on main failed'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One release at a time: two overlapping runs would race on the version-bump commit and the tags.
# Re-publish dispatches (`tag` set) never touch the bump commit or tags, and get a group per tag:
# one shared group keeps a single pending run, so dispatching several tags cancelled all but the last.
concurrency:
  group: release${{ inputs.tag != '' && format('-republish-{0}', inputs.tag) || '' }}
  cancel-in-progress: false

jobs:
  # Holds the release back while the newest finished CI run on main is red, so a scheduled run never
  # tags and publishes a tree whose tests fail. Cancelled and skipped runs (a newer push superseded
  # them) are ignored, and a release commit is `[skip ci]`, so it has no run of its own. A manual
  # dispatch can bypass the gate with `skip_ci_check`; a re-publish (`tag` set) is never gated.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Check the latest CI run on main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BYPASS: ${{ inputs.skip_ci_check }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ] || [ "$BYPASS" = "true" ]; then
            echo "CI gate bypassed (re-publish or skip_ci_check)."
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh run list --workflow ci.yml --branch main --status completed --limit 30             --json conclusion,event,url,headSha             --jq '[.[] | select(.event != "pull_request" and .conclusion != "cancelled" and .conclusion != "skipped")] | .[0] // empty | [.conclusion, .url, .headSha] | @tsv')
          if [ -z "$latest" ]; then
            echo "No finished CI run found on main; not blocking."
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=$'	' read -r conclusion url sha <<< "$latest"
          echo "Latest CI run on main: $conclusion ($sha) $url"
          if [ "$conclusion" = "success" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release skipped: the latest CI run on main ended '$conclusion' ($url). Fix main, or dispatch with skip_ci_check to bypass."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          fi

  # Everything that runs third-party code: the install, the build, the smoke tests and git-cliff.
  # Its token is read-only and nothing here can push, tag or release. What the writing `release`
  # job needs from it (changelogs, release notes, the lockfile with its bumped workspace versions)
  # travels as an artifact.
  prepare:
    needs: [ci-gate]
    # Full release on schedule, or on manual dispatch without a tag input. Dispatch WITH a tag
    # skips straight to the publish jobs (re-publish mode). Held back while CI on main is red.
    if: |
      needs.ci-gate.outputs.blocked != 'true' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag == '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.plan.outputs.any_changed || 'false' }}
      any_adopt: ${{ steps.adopt.outputs.any_adopt || 'false' }}
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Plan FIRST (before installing or building): it only reads git history and the npm registry.
      # It is the first of two early-exit gates, so a quiet hour is a cheap no-op.
      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs --write

      # A changelog may carry a hand-written section for the release, headed `- Unreleased` (see
      # scripts/crafted-changelogs.mjs). Fail now, before installing, building or tagging, when one
      # names another version or tag than the plan, or a viewer's `## Unreleased` section names a
      # release the plan does not make.
      - name: Check the hand-written changelog sections
        if: steps.plan.outputs.any_changed == 'true'
        run: node scripts/crafted-changelogs.mjs --check release-plan.json

      # A package published by hand (the manual first publish of ooxml-ui) has no tag yet; the
      # `release` job pushes its baseline tag, so it runs even when nothing else changed.
      - name: Look for baseline tags to adopt
        id: adopt
        run: |
          any=$(node -p "Object.values(require('./release-plan.json').packages).some((p) => p.adopt)")
          echo "any_adopt=$any" >> "$GITHUB_OUTPUT"

      # Publishing is switched on per repository, so a release is never tagged that cannot be
      # published afterwards. Set the NPM_PUBLISH repository variable to 'true' to enable.
      - name: Verify publishing is enabled
        if: steps.plan.outputs.any_changed == 'true' && vars.NPM_PUBLISH != 'true'
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true': a release was planned but npm publishing is disabled."
          echo "Set the NPM_PUBLISH repository variable to 'true' (Settings > Secrets and variables > Actions > Variables)."
          exit 1

      # `release-plan.mjs --write` bumped the package.json versions, and bun.lock records every
      # workspace's version, so `--frozen-lockfile` would refuse the install. Install normally,
      # then fail unless the lockfile changed ONLY in workspace package versions: a new or moved
      # third-party resolution must never ship in a release commit unreviewed. The `release` job
      # checks the lockfile it receives again.
      - name: Install dependencies
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          bun install
          node scripts/check-lockfile-drift.mjs

      # All-or-nothing: a build or smoke-test failure fails the run before anything is committed,
      # tagged or published, and the next run retries from the same baseline. Typecheck and the
      # unit tests are not repeated here: `main` is protected by the `ci-success` check.
      - name: Build and smoke-test the package
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          node scripts/publish-released.mjs --plan release-plan.json --verify
          bun run build
          bun run test:package
          node scripts/build-released.mjs --smoke
          node scripts/publish-released.mjs --plan release-plan.json --entry-points

      # Prepend the new release section to CHANGELOG.md. Prepend (rather than regeneration) means
      # shipped sections are never rewritten, so old tags can be culled by prune-releases without
      # corrupting changelog history. git-cliff is the version bun.lock pins, run from
      # node_modules; cliff.toml has no `[remote.github]` block, so it needs no token. A package
      # whose changelog already has a hand-written section for this release is skipped.
      - name: Generate the changelog
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          # `$inc` holds git-cliff glob PATTERNS ("src/**") and must stay unquoted so its words
          # split into separate arguments; disable filename expansion so the shell does not expand
          # the globs first (that silently produced heading-only changelog sections).
          set -f
          cliff=node_modules/.bin/git-cliff
          field() { node -p "require('./release-plan.json').packages['$1']$2"; }
          crafted=" $(node scripts/crafted-changelogs.mjs --pending release-plan.json) "
          for key in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).join(' ')"); do
            npm=$(field "$key" .npm)
            tag=$(field "$key" .tag)
            changelog=$(field "$key" .changelog)
            case "$crafted" in
              *" $key "*)
                echo "Changelog for $npm -> $tag ($changelog): hand-written, git-cliff skipped"
                continue
                ;;
            esac
            inc=$(node -e "console.log(require('./release-plan.json').packages['$key'].includePaths.map(p => '--include-path ' + p).join(' '))")
            echo "Changelog for $npm -> $tag ($changelog)"
            if [ -f "$changelog" ]; then
              "$cliff" --config cliff.toml --tag-pattern "^${npm}@" $inc --unreleased --tag "$tag" --prepend "$changelog"
            else
              "$cliff" --config cliff.toml --tag-pattern "^${npm}@" $inc --tag "$tag" --output "$changelog"
            fi
          done

      # A major release with hand-written notes in .release-notes/<name>/ gets each package's share
      # of them above its git-cliff commit list. The step fails, before anything is tagged, when a
      # note names an unknown package or a published package has none. A hand-written section
      # already carries its notes and is left alone.
      - name: Add the release notes to the changelogs
        if: steps.plan.outputs.any_changed == 'true'
        run: node scripts/major-notes.mjs --plan release-plan.json

      # Each hand-written section gets today's date (UTC) in place of `Unreleased`.
      - name: Date the hand-written changelog sections
        if: steps.plan.outputs.any_changed == 'true'
        run: node scripts/crafted-changelogs.mjs --date release-plan.json

      # Each viewer's root changelog gets one dated section naming the viewer packages released
      # today, built from the package sections git-cliff just wrote (a second run on the same day
      # extends that day's section). A hand-written `## Unreleased` section naming this run's
      # releases is dated instead, and the releases it names are left out of the built section.
      - name: Update the viewer changelogs
        if: steps.plan.outputs.any_changed == 'true'
        run: node scripts/viewer-changelogs.mjs --plan release-plan.json

      # The GitHub release body of each package, rendered here because it runs git-cliff too. A
      # hand-written section is used as it stands (without its marker comment).
      - name: Write the release notes
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/prepared/notes"
          for key in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).join(' ')"); do
            node scripts/release-notes.mjs "$key" > "$RUNNER_TEMP/prepared/notes/${key}.md"
          done

      - name: Collect the prepared release
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          # shellcheck disable=SC2046
          cp --parents release-plan.json bun.lock $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).map(k=>p.packages[k].changelog).join(' ')") "$RUNNER_TEMP/prepared/"
          for changelog in viewers/*/CHANGELOG.md; do
            if [ -f "$changelog" ]; then cp --parents "$changelog" "$RUNNER_TEMP/prepared/"; fi
          done

      - name: Upload the prepared release
        if: steps.plan.outputs.any_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
          retention-days: 1
          if-no-files-found: error

  # The only job that writes to the repository: it pushes baseline tags and the release commit,
  # and creates the GitHub releases. It runs no third-party code (no Bun, no install, no build, no
  # third-party action; `scripts/workflow-lint.mjs` enforces that), so nothing else in the job can
  # reach its token. It plans the release again itself, so the versions and manifests it commits
  # never come from the artifact, and it takes from the artifact only the files its own plan names.
  release:
    needs: [ci-gate, prepare]
    if: |
      needs.prepare.result == 'success' && (
        needs.prepare.outputs.any_changed == 'true' || needs.prepare.outputs.any_adopt == 'true'
      )
    runs-on: ubuntu-latest
    # Commits the version bump and pushes the tags.
    permissions:
      contents: write
    outputs:
      any_released: ${{ steps.tagged.outputs.any_released || 'false' }}
      release_sha: ${{ steps.tagged.outputs.release_sha || '' }}
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      # This job pushes a version-bump commit straight to `main` with the workflow's own
      # GITHUB_TOKEN (the workflow has `contents: write`). No personal access token is used:
      # npm publishing goes through trusted publishing (OIDC), and the push relies on `main`
      # accepting direct pushes from GitHub Actions. If a ruleset is ever added to `main`, it must
      # let this workflow push, or the release commit is rejected.
      #
      # Credentials are NOT persisted in .git/config. The steps that push (adopt tags, commit the
      # release) receive the token as PUSH_TOKEN and authenticate that one git command with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # The same commit and registry as `prepare`, so the same plan; the next step checks that.
      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs --write

      # A package published by hand (the manual first publish of ooxml-ui) has no tag yet. The
      # planner baselines it at the commit npm recorded (or HEAD); record that as the tag so the
      # next run finds it. No-op once the tags exist.
      - name: Adopt baseline tags for packages published by hand
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          node -e "for (const p of Object.values(require('./release-plan.json').packages)) if (p.adopt) console.log(p.adopt.tag + ' ' + p.adopt.sha)" |
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            echo "Adopting $tag at $sha"
            git tag "$tag" "$sha"
            git push "$remote" "refs/tags/$tag"
          done

      - name: Download the prepared release
        if: steps.plan.outputs.any_changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared

      # The artifact was written by a job that ran third-party code, so it is data: the two plans
      # must agree, only the lockfile and the changelogs this job's plan names are copied, and the
      # lockfile may differ from HEAD only in workspace versions.
      - name: Take the prepared changelogs and lockfile
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          prepared="$RUNNER_TEMP/prepared"
          if ! cmp -s release-plan.json "$prepared/release-plan.json"; then
            echo "::error::The prepare job planned a different release; re-run the workflow."
            diff "$prepared/release-plan.json" release-plan.json || true
            exit 1
          fi
          cp "$prepared/bun.lock" bun.lock
          node scripts/check-lockfile-drift.mjs
          for changelog in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).map(k=>p.packages[k].changelog).join(' ')"); do
            cp "$prepared/$changelog" "$changelog"
          done
          for viewer in viewers/*/; do
            if [ -f "$prepared/${viewer}CHANGELOG.md" ]; then
              cp "$prepared/${viewer}CHANGELOG.md" "${viewer}CHANGELOG.md"
            fi
          done

      - name: Commit version bumps and changelogs
        if: steps.plan.outputs.any_changed == 'true'
        env:
          # Authenticates the push and fetch below only; it is not stored in .git/config.
          PUSH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage each released package's changelog and manifest (version bump) AND the lockfile,
          # so package.json + bun.lock in the repo always match what is published and the tag
          # points at a commit whose manifests are truthful. The paths are split into words on purpose.
          # shellcheck disable=SC2046
          git add $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).flatMap(k=>[p.packages[k].manifest,p.packages[k].changelog]).join(' ')") bun.lock viewers/*/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): bump versions and update changelogs [skip ci]"
            # `main` can move between checkout and here; rebase onto the new tip and retry.
            pushed=false
            for attempt in 1 2 3; do
              if git push "$remote" HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt was rejected; rebasing onto origin/main"
              git fetch "$remote" +refs/heads/main:refs/remotes/origin/main
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                echo "::error::Release commit conflicts with origin/main; resolve by hand and re-run."
                exit 1
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push the release commit to main after 3 attempts."
              echo "The push ran as github-actions[bot] with GITHUB_TOKEN. Check that no ruleset or"
              echo "branch protection on main rejects pushes from GitHub Actions."
              echo "Rules: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/rules"
              exit 1
            fi
          fi

      # Cut the tag + GitHub release. The tag points at the (pushed) release commit; the
      # release body is that package's notes from the prepare job. No tarball assets: npm (with
      # provenance) is the artifact registry. GITHUB_TOKEN-created tags do not trigger workflows.
      - name: Tag and release changed packages
        id: tagged
        if: steps.plan.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          field() { node -p "require('./release-plan.json').packages['$1']$2"; }
          RELEASED=""
          for key in $(node -p "const p=require('./release-plan.json');p.order.filter(k=>p.packages[k].release).join(' ')"); do
            tag=$(field "$key" .tag)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping"
              continue
            fi
            cp "$RUNNER_TEMP/prepared/notes/${key}.md" "${RUNNER_TEMP}/notes.md"
            changelog=$(field "$key" .changelog)
            {
              echo ""
              echo "---"
              echo "Superseded releases are pruned from this page; the full version history lives in [\`${changelog}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/${changelog})."
            } >> "${RUNNER_TEMP}/notes.md"
            gh release create "$tag" --target "$COMMIT" --title "$tag" --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Released $tag"
            RELEASED="${RELEASED}${key} "
          done
          if [ -n "$RELEASED" ]; then
            echo "any_released=true" >> "$GITHUB_OUTPUT"
            echo "release_sha=$COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "any_released=false" >> "$GITHUB_OUTPUT"
          fi

      # Stash the release plan so the publish job can resolve package versions without
      # re-running the planner. Artifact names are unique per run.
      - name: Upload release plan for publish job
        if: steps.tagged.outputs.any_released == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          retention-days: 1

      # Retire the releases each new tag supersedes (tags are kept), so the Releases page lists
      # one release per package: the current version. The scheduled prune-releases workflow is the
      # backstop.
      - name: Prune superseded releases
        if: steps.tagged.outputs.any_released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-releases.mjs --keep 1

  # Publish to npm, in two modes:
  #
  # AUTO (schedule, or dispatch without a tag): runs after the `release` job, checks out the
  #   release commit it pushed and publishes the packages listed in the release-plan.json artifact.
  #
  # RE-PUBLISH (dispatch with a tag): skips the `release` job and publishes exactly the tag
  #   supplied via the `tag` input. It builds the dispatched commit, which every job pins to
  #   `refs/heads/main` (a dispatch from any other ref fails its first step), not the tag: the
  #   tag's own tree can predate the scripts and layout this workflow runs (an old tree once ran
  #   its own publish script in the planning job). The tag must be an ancestor of main, and
  #   `publish-released.mjs` refuses a package whose manifest is not at the tag's version, so a
  #   tag that `main` has moved past fails loudly instead of publishing something else.
  #
  # Build and publish are separate jobs: `build-packages` installs, builds and packs with no
  #   `id-token`; `publish` (environment `npm`, `id-token: write`) installs nothing, builds nothing
  #   and uploads only the tarballs `build-packages` produced.
  #
  # The packages are split into build groups (core, ui, mcp, and one group per viewer, see
  # `publish-released.mjs --groups`) so `build-packages` builds and packs them in parallel. The
  # core is built once (`build-core`) and its dist is shared. `publish` then runs as a single job
  # in dependency order so GitHub records one `npm` deployment per release run (parallel matrix
  # jobs on the same environment race and mark earlier-finishing deployments inactive, leaving the
  # newest deployment ID inactive whenever another group finishes last). A package whose sibling
  # was released earlier in the run waits for that sibling to appear on npm.
  #
  # Auth: npm trusted publishing (OIDC), no token. The package needs a trusted publisher on
  # npmjs.com pointing at this repository, the workflow file `release.yml` and the environment `npm`.
  publish-plan:
    needs: [release]
    # `always()` lets this job run even when `release` was skipped (re-publish dispatch).
    if: |
      always() &&
      needs.release.result != 'failure' && (
        needs.release.outputs.any_released == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      - name: Verify publishing is enabled
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true' - npm publishing is disabled."
          exit 1

      - name: Checkout the release commit
        if: inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout the dispatched commit (re-publish)
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Re-publish builds main's current commit, so the tag must exist and be part of main's
      # history; a tag on another branch (or a forged name) is refused before anything is built.
      - name: Check the re-publish tag belongs to main
        if: inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/${INPUT_TAG}^{commit}" >/dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${INPUT_TAG}^{commit}" HEAD; then
            echo "::error::Tag '$INPUT_TAG' is not an ancestor of main; refusing to re-publish it."
            exit 1
          fi

      - name: List the publish groups
        id: groups
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            groups=$(node scripts/publish-released.mjs --tag "$INPUT_TAG" --groups)
          else
            groups=$(node scripts/publish-released.mjs --plan release-plan.json --groups)
          fi
          echo "Publish groups: $groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  # Builds the core once; every publish group needs its dist (ooxml-ui and the viewers resolve the
  # core through it, and the core group publishes it).
  build-core:
    needs: [release, publish-plan]
    # `always()`: `release` is skipped in re-publish mode, and a skipped need skips this job otherwise.
    if: |
      always() &&
      needs.publish-plan.result == 'success' &&
      needs.publish-plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      - name: Checkout the release commit
        if: inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout the dispatched commit (re-publish)
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Share the core build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-dist-${{ github.run_id }}
          path: src/core/dist
          retention-days: 1
          if-no-files-found: error

  # Builds and packs each group's tarballs. This job installs dependencies and runs the package
  # build scripts (third-party code), so it has NO `id-token` permission, no `npm` environment and
  # no persisted credentials: nothing in it can mint a publish credential. The tarballs travel to
  # the `publish` job as an artifact, and only that job can reach npm.
  build-packages:
    needs: [release, publish-plan, build-core]
    if: always() && needs.build-core.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One group failing must not cancel the others: a re-run only publishes what is missing.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.publish-plan.outputs.groups) }}
    name: build (${{ matrix.group }})
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      # Auto mode: the release commit the release job pushed (so manifests carry the new versions).
      - name: Checkout the release commit
        if: inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      # Re-publish mode: the dispatched commit, which the guard above pins to main (the manifest
      # check ties it to the tag, and publish-plan checked the tag is an ancestor of main).
      - name: Checkout the dispatched commit (re-publish)
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Restore the core build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core-dist-${{ github.run_id }}
          path: src/core/dist

      # Builds only this group's packages. The core is already built; in re-publish mode there is
      # no plan artifact, so build every workspace package present in the group.
      - name: Build the group
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GROUP: ${{ matrix.group }}
        run: |
          if [ "$GROUP" = "core" ]; then
            exit 0
          fi
          if [ -n "$INPUT_TAG" ]; then
            node scripts/release-plan.mjs --no-npm >/dev/null
            node scripts/build-released.mjs --all --group "$GROUP"
          else
            node scripts/build-released.mjs --group "$GROUP"
          fi

      # A `workspace:` range on a sibling is rewritten to a caret range inside the packed manifest.
      # Every manifest check of publish-released.mjs runs here; the tarballs and a checksum index
      # (`packed.json`) are all the publish job receives.
      - name: Pack the group's tarballs
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GROUP: ${{ matrix.group }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/publish-released.mjs --tag "$INPUT_TAG" --group "$GROUP" --pack "$RUNNER_TEMP/packed"
          else
            node scripts/publish-released.mjs --plan release-plan.json --group "$GROUP" --pack "$RUNNER_TEMP/packed"
          fi

      # Artifact names cannot contain `/` (a viewer group is `viewers/docx`).
      - name: Name the tarball artifact
        id: artifact
        env:
          GROUP: ${{ matrix.group }}
        run: echo "name=packages-${GROUP//\//-}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/packed
          retention-days: 1
          if-no-files-found: error

  # The only job with `id-token: write` in the `npm` environment. It runs as a single job (not a
  # matrix) so GitHub records one `npm` deployment per release run instead of parallel deployments
  # marking each other inactive. It runs no `bun install` and no build: it checks out the
  # repository for the (dependency-free) release scripts only, downloads every group's tarballs
  # from `build-packages`, and uploads them in dependency order with provenance.
  # publish-released.mjs checks each tarball against its recorded checksum and against the release
  # target (name and version) before uploading, waits for a sibling released earlier in the run,
  # and skips a version already on npm.
  publish:
    needs: [release, publish-plan, build-packages]
    # A group whose build failed has no artifact and is recorded as a failure; the other groups
    # still publish.
    if: |
      always() &&
      needs.publish-plan.result == 'success' &&
      needs.publish-plan.outputs.groups != '[]' &&
      (needs.build-packages.result == 'success' || needs.build-packages.result == 'failure')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      # Scripts and manifests only (nothing is installed or built). Same commits as build-packages.
      - name: Checkout the release commit
        if: inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: Checkout the dispatched commit (re-publish)
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      # Each group's artifact extracts into its own subdirectory under `$RUNNER_TEMP/packed`
      # (`merge-multiple` defaults to false), keeping each group's `packed.json` intact.
      - name: Download the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*-${{ github.run_id }}
          path: ${{ runner.temp }}/packed

      # Node 24 plus npm >= 11.5.1 is required for trusted publishing and --provenance. Node 24
      # bundles npm 11.5.1 or newer since 24.6, so the bundled npm is used as is (an unpinned
      # global install would be an npm command Scorecard cannot pin) and checked below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi
          echo "npm $version"

      # Publishes each group in dependency order (core, ui, mcp, then the viewers) and waits for
      # any sibling released earlier in this run to become visible on the registry.
      - name: Publish to npm
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GROUPS: ${{ needs.publish-plan.outputs.groups }}
        run: |
          # publish-released.mjs runs `npm publish <tarball> --provenance` once per package.
          failed=0
          ui_failed=0
          while IFS= read -r group; do
            [ -z "$group" ] && continue
            if [ "$ui_failed" -ne 0 ] && [[ "$group" == viewers/* ]]; then
              echo "::error::Skipping group '$group' because 'ui' failed to publish."
              continue
            fi
            dir="$RUNNER_TEMP/packed/packages-${group//\//-}-${GITHUB_RUN_ID}"
            if [ ! -d "$dir" ]; then
              echo "::error::Missing packed artifact for group '$group' (its build job failed)."
              failed=1
              if [ "$group" = "core" ]; then break; fi
              if [ "$group" = "ui" ]; then ui_failed=1; fi
              continue
            fi
            if [ -n "$INPUT_TAG" ]; then
              if ! node scripts/publish-released.mjs --tag "$INPUT_TAG" --group "$group" --from-dir "$dir"; then
                failed=1
                if [ "$group" = "core" ]; then break; fi
                if [ "$group" = "ui" ]; then ui_failed=1; fi
              fi
            else
              if ! node scripts/publish-released.mjs --plan release-plan.json --group "$group" --from-dir "$dir"; then
                failed=1
                if [ "$group" = "core" ]; then break; fi
                if [ "$group" = "ui" ]; then ui_failed=1; fi
              fi
            fi
          done < <(node -e "for (const g of JSON.parse(process.env.GROUPS)) console.log(g)")
          exit "$failed"

  # A package that was tagged but never published needs recovery. The next online planner cuts
  # a fresh version; also fail loudly here with the command for retrying the existing version.
  verify-published:
    needs: [release, publish]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag == '' && needs.release.outputs.release_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/check-published.mjs --wait-minutes 20

  # Signs each published tarball with a keyless sigstore bundle, so the release assets are signed
  # (OpenSSF Scorecard "Signed-Releases"). It runs after the packages are verifiable on the registry
  # and never gates publishing: a failure here leaves the npm release intact and only the signatures
  # missing. Re-run it with a `tag` dispatch. cosign is third-party code, so this job's token is
  # read-only and its signing step gets none; `attach-release-assets` uploads what it signed.
  sign-release:
    name: sign release assets
    needs: [release, publish, verify-published]
    if: always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless sigstore signing with the workflow identity
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag == '' && needs.release.outputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the release assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/sign-release-assets.mjs --tag "$INPUT_TAG" --dir "$RUNNER_TEMP/release-assets"
          else
            node scripts/sign-release-assets.mjs --plan release-plan.json --dir "$RUNNER_TEMP/release-assets"
          fi

      # Uploaded even when one package failed to sign, so the others are still attached.
      - name: Upload the signed assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets
          retention-days: 1
          if-no-files-found: ignore

  # Uploads the signed tarballs and bundles to their GitHub releases. It can write releases, so it
  # runs only first-party steps, and `attach-release-assets.mjs` uploads a tarball only when it is
  # the one the npm registry serves.
  attach-release-assets:
    name: attach release assets
    needs: [release, sign-release]
    if: always() && !cancelled() && (needs.sign-release.result == 'success' || needs.sign-release.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads the release assets
    steps:
      - name: Refuse to run off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Release runs only from refs/heads/main (this run is on $REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag == '' && needs.release.outputs.release_sha || github.sha }}
          persist-credentials: false # gh authenticates with GH_TOKEN; git needs no credentials

      - name: Download release plan
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      - name: Download the signed assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Attach the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/attach-release-assets.mjs --tag "$INPUT_TAG" --dir "$RUNNER_TEMP/release-assets"
          else
            node scripts/attach-release-assets.mjs --plan release-plan.json --dir "$RUNNER_TEMP/release-assets"
          fi

  # Tells the Discord server what shipped: one message per release run (not one per package), with
  # the notes of the core, ui and mcp packages and whether npm publishing succeeded. Best effort by
  # design: it never gates anything, and it is skipped when DISCORD_WEBHOOK_RELEASES is not set
  # (forks). Set it with `node scripts/discord-webhook.mjs releases`, see docs/discord.md.
  announce-discord:
    name: announce on Discord
    needs: [release, publish, verify-published]
    if: always() && !cancelled() && inputs.tag == '' && needs.release.outputs.any_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release view reads the release bodies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false

      - name: Download release plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan-${{ github.run_id }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Post the release summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failure
          if [ "$PUBLISH_RESULT" = "success" ]; then status=success; fi
          node scripts/announce-discord.mjs --plan release-plan.json --status "$status" --run-url "$RUN_URL"
