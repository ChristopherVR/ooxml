name: Publish npm package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
env:
  PPTX_VIEWER_FIXTURES_REF: a9b95c62ff904f041f514cdc7bd3caa827ac2f2b
jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:package
      - name: Verify the tag matches the package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Tag $RELEASE_TAG does not match package version $VERSION"; exit 1; }
      - name: Publish with provenance (OIDC trusted publishing)
        run: npm publish --provenance --access public
