name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run --cwd packages/ui typecheck

  # The unit suite is ~1,200 files and most of its time is spent importing the pptx area into each
  # file, so it is split across parallel runners by file (`vitest --shard`). The floor is the
  # slowest single file (the salt-less WHIRLPOOL modifyVerifier fixture, ~80s), not the shard count.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # Release machinery: planner, publish guards, commit and changelog checks.
      - run: bun run test:scripts
      - run: bun run check:changelog
      - run: bun run build
      - run: bun run test:package
      # The shared UI package (packages/ui): tests, build and a packed-tarball import check.
      - run: bun run --cwd packages/ui test
      - run: bun run --cwd packages/ui build
      - run: bun run --cwd packages/ui test:package
      - name: The core never imports the UI package
        run: |
          if grep -rEln "ooxml-ui" src --include='*.ts' --include='*.mjs' | grep -v '\.test\.'; then
            echo "::error::src/ (the core) must not import ooxml-ui; the UI depends on the core, never the reverse."
            exit 1
          fi

  # The single check the `main` ruleset requires. Funnelling through one job keeps branch
  # protection stable when jobs are added or renamed (a required check that no longer exists blocks
  # every PR silently). `always()` plus the explicit result test is deliberate: without it a
  # cancelled or skipped dependency would let this pass.
  ci-success:
    name: ci-success
    if: always()
    needs: [typecheck, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success) ;;
              *)
                echo "::error::A required CI job did not succeed (got: $results)."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs succeeded."
